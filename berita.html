<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASRAMA PUSTAQKIH NWDI GELOGOR</title>
    <style>
        /* [Kode CSS sebelumnya tetap sama] */
        
        /* Gaya untuk bagian Berita */
        .news-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }
        
        .news-card {
            background-color: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        
        .news-card:hover {
            transform: translateY(-5px);
        }
        
        .news-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        
        .news-content {
            padding: 1.5rem;
        }
        
        .news-date {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }
        
        .news-title {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            color: #2c786c;
        }
        
        .news-excerpt {
            margin-bottom: 1rem;
            color: #555;
        }
        
        .read-more {
            display: inline-block;
            color: #2c786c;
            font-weight: bold;
            text-decoration: none;
        }
        
        .read-more:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <!-- [Kode header, nav, hero section tetap sama] -->
    
    <div class="container">
        <!-- [Kode profil, program, fasilitas tetap sama] -->
        
        <section id="berita" class="section">
            <h2 class="section-title">Berita Terkini</h2>
            
        
            <!-- Form Tambah Berita (untuk admin) -->
            <div class="upload-form">
                <h3>Tambah Berita Baru</h3>
                <form id="newsForm">
                    <div class="form-group">
                        <label for="news-title">Judul Berita:</label>
                        <input type="text" id="news-title" name="news-title" required>
                    </div>
                    <div class="form-group">
                        <label for="news-date">Tanggal:</label>
                        <input type="date" id="news-date" name="news-date" required>
                    </div>
                    <div class="form-group">
                        <label for="news-image">Gambar Berita:</label>
                        <input type="file" id="news-image" name="news-image" accept="image/*" required>
                    </div>
                    <div class="form-group">
                        <label for="news-content">Isi Berita:</label>
                        <textarea id="news-content" name="news-content" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="btn">Publikasikan Berita</button>
                </form>
            </div>
        </section>
    </div>
    
    <!-- [Kode footer tetap sama] -->

    <script>
        // Script untuk menambahkan berita (contoh sederhana)
        document.getElementById('newsForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const title = document.getElementById('news-title').value;
            const date = document.getElementById('news-date').value;
            const content = document.getElementById('news-content').value;
            const imageInput = document.getElementById('news-image');
            
            if (imageInput.files.length > 0) {
                const file = imageInput.files[0];
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    const newsContainer = document.querySelector('.news-container');
                    const newsCard = document.createElement('div');
                    newsCard.className = 'news-card';
                    newsCard.innerHTML = `
                        <img src="${e.target.result}" alt="${title}" class="news-image">
                        <div class="news-content">
                            <div class="news-date">${formatDate(date)}</div>
                            <h3 class="news-title">${title}</h3>
                            <p class="news-excerpt">${content.substring(0, 100)}...</p>
                            <a href="#" class="read-more">Baca Selengkapnya →</a>
                        </div>
                    `;
                    
                    // Tambahkan berita baru di bagian atas
                    newsContainer.insertBefore(newsCard, newsContainer.firstChild);
                    
                    // Reset form
                    document.getElementById('newsForm').reset();
                    
                    alert('Berita berhasil ditambahkan!');
                };
                
                reader.readAsDataURL(file);
            }
        });
        
        function formatDate(dateString) {
            const options = { year: 'numeric', month: 'long', day: 'numeric' };
            return new Date(dateString).toLocaleDateString('id-ID', options);
        }
    </script>
</body>
</html>
